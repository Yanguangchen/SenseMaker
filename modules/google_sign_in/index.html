<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; padding: 4px 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; background: transparent; }
    button {
      font-family: inherit;
      border: 1px solid #b8c5d2;
      border-radius: 14px;
      padding: 14px 20px;
      min-height: 54px;
      font-size: 16px;
      font-weight: 600;
      background: white;
      color: #262730;
      cursor: pointer;
      width: 100%;
      transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 180ms ease, border-color 180ms ease, background-color 180ms ease;
    }
    button:hover:not(:disabled) {
      border-color: #4A90D9;
      background: #f7fbff;
      box-shadow: 0 8px 18px rgba(38, 39, 48, 0.14);
    }
    button:active:not(:disabled) { transform: translateY(0) scale(0.98); box-shadow: none; }
    button:disabled { cursor: wait; opacity: .65; }
    button:focus-visible { outline: 3px solid #b5a6ff; outline-offset: 3px; }
    p { color: #ffb4bc; font-size: 13px; line-height: 1.5; margin: 12px 0 0; font-family: inherit; overflow-wrap: anywhere; }
    p:empty { display: none; }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
      button:hover:not(:disabled), button:active:not(:disabled) { transform: none; }
    }
  </style>
</head>
<body>
  <button id="sign-in" disabled>Loading Google sign-in…</button>
  <p id="message" role="alert" aria-live="polite"></p>
  <script type="module" src="./sign-in.js?v=20261102-1"></script>
</body>
</html>
