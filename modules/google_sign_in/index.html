<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: Outfit, sans-serif; font-size: 14px; }
    button {
      font-family: inherit;
      border: 1px solid #b8c5d2;
      border-radius: 8px;
      padding: 10px 16px;
      background: white;
      color: #262730;
      cursor: pointer;
      width: 100%;
      transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 180ms ease, border-color 180ms ease, background-color 180ms ease;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: #4A90D9;
      background: #f7fbff;
      box-shadow: 0 8px 18px rgba(38, 39, 48, 0.14);
    }
    button:active:not(:disabled) { transform: translateY(0) scale(0.98); box-shadow: none; }
    button:disabled { cursor: wait; opacity: .65; }
    p { color: #a51c30; font-size: 13px; margin: 8px 0; font-family: inherit; }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
      button:hover:not(:disabled), button:active:not(:disabled) { transform: none; }
    }
  </style>
</head>
<body>
  <button id="sign-in" disabled>Loading Google sign-in…</button>
  <p id="message" role="alert"></p>
  <script type="module" src="./sign-in.js"></script>
</body>
</html>
