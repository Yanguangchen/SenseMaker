[server]
headless = true

# Dark glass theme. Card, tab and background styling lives in modules/theme/glass.css;
# backgroundColor matches a glass card so dataframes blend into it.
[theme]
base = "dark"
primaryColor = "#8B7BFF"
backgroundColor = "#0D1129"
secondaryBackgroundColor = "#161B3D"
textColor = "#ECEEFF"
linkColor = "#A5B4FF"
borderColor = "#3D4479"
dataframeBorderColor = "#353C6F"
dataframeHeaderBackgroundColor = "#141938"
codeBackgroundColor = "#11163A"
baseRadius = "14px"
buttonRadius = "14px"
showWidgetBorder = true
font = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@400..700&display=swap"
headingFont = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@400..700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

[theme.sidebar]
backgroundColor = "#0A0D22"
secondaryBackgroundColor = "#151A3A"
