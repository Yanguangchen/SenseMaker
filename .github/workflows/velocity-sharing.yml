name: Full regression and coverage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Full Python and browser regression suite
        env:
          E2E_ARTIFACT_DIR: artifacts/velocity-sharing
        run: python -m coverage run -m pytest -q
      - name: Enforce coverage floor
        if: always()
        run: |
          python -m coverage xml --fail-under=0 -o artifacts/coverage.xml
          python -m coverage report
      - name: Save coverage and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-artifacts
          path: artifacts
          if-no-files-found: ignore
          retention-days: 7

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: msasensemaker/package-lock.json
      - name: Dashboard component tests
        run: node --experimental-vm-modules --test tests/*.mjs
      - name: Install Devvit dependencies
        working-directory: msasensemaker
        run: npm ci
      - name: Devvit checks
        working-directory: msasensemaker
        run: |
          npm run test:unit
          npm run test:types
          npm run lint

  firebase-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r requirements-test.txt
      - run: npm install --global firebase-tools@15.22.1
      - name: Auth and Firestore SDK integration
        run: >-
          firebase emulators:exec --config firebase.test.json
          --project demo-sensemaker --only auth,firestore
          'SENSEMAKER_EMULATOR_TESTS=1 python -m pytest tests/integration -q'
