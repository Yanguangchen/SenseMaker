name: Velocity sharing regression

on:
  pull_request:
    paths:
      - 'dashboard.py'
      - 'modules/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.streamlit/**'
      - '.github/workflows/velocity-sharing.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard.py'
      - 'modules/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.streamlit/**'
      - '.github/workflows/velocity-sharing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  share-link:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements-hosted.txt pytest
          python -m playwright install --with-deps chromium
      - name: Sharing and card regression tests
        run: python -m pytest tests/test_velocity_sharing.py tests/test_velocity_tracking.py tests/test_velocity_history.py -q
      - name: Share-link browser lifecycle
        env:
          VELOCITY_SHARING_E2E: '1'
          E2E_ARTIFACT_DIR: artifacts/velocity-sharing
        run: python -m pytest tests/test_velocity_sharing_e2e.py -q
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: velocity-sharing-failure
          path: artifacts/velocity-sharing
          if-no-files-found: ignore
          retention-days: 7
